specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CrowdFunding
    network: mainnet
    source:
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      abi: CrowdFunding
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Campaign
        - Donation
        - ProjectUpdate
        - Comment
        - Donor
        - ProtocolMetric
      abis:
        - name: CrowdFunding
          file: ../artifacts/contracts/CrowdFunding.sol/CrowdFunding.json
      eventHandlers:
        - event: CampaignCreated(indexed uint256,indexed address,string,uint256,uint256,string,string)
          handler: handleCampaignCreated
        - event: DonationReceived(indexed uint256,indexed address,uint256,uint256)
          handler: handleDonationReceived
        - event: UpdatePosted(indexed uint256,indexed uint256,string,uint256)
          handler: handleUpdatePosted
        - event: CommentAdded(indexed uint256,indexed address,string,uint256)
          handler: handleCommentAdded
      file: ./src/mapping.ts
